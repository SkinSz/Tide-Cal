[package]
name = "tide"
version = "0.1.0"
description = "Tide — local-first calendar with encrypted sync"
authors = ["SkinS / Tide Project"]
license = "LicenseRef-Tide-Source-Available-Non-Commercial"
repository = "https://github.com/SkinS/Tide-Cal"
edition = "2021"
rust-version = "1.77.2"
publish = false

# See more keys and their attributes at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
toml = "0.8"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
mdns-sd = { version = "0.21.0", optional = true }

[features]
mdns = ["dep:mdns-sd"]
