<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tide</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header id="toolbar">
      <button id="btn-prev" title="Previous">‹</button>
      <button id="btn-today">Today</button>
      <button id="btn-next" title="Next">›</button>
      <h1 id="cal-label"></h1>
      <span class="spacer"></span>
      <button id="btn-conflicts" title="No unresolved conflicts">
        <span class="conflicts-label">⚠ Conflicts (0)</span>
      </button>
      <button id="btn-new">+ New event</button>
      <div class="seg">
        <button id="btn-month">Month</button>
        <button id="btn-week">Week</button>
      </div>
    </header>

    <main id="calendar-grid" aria-label="Calendar"></main>

    <dialog id="event-dialog">
      <div class="dlg-body">
        <h2 id="dialog-title">New event</h2>
        <label>Title
          <input id="ev-title" required maxlength="200" />
        </label>
        <label>Description
          <textarea id="ev-desc" rows="2"></textarea>
        </label>
        <label>Day
          <input type="date" id="ev-date" required />
        </label>
        <button type="button" id="ev-date-ok" class="primary">OK</button>
        <label class="check"><input type="checkbox" id="ev-allday" /> Whole day</label>
        <div id="ev-time-row">
          <label>Start <input type="time" id="ev-start-t" /></label>
          <label>End <input type="time" id="ev-end-t" /></label>
        </div>
        <input type="hidden" id="ev-id" />
        <menu>
          <button type="button" id="ev-delete" class="danger" hidden>Delete</button>
          <span class="spacer"></span>
          <button type="button" id="ev-cancel">Cancel</button>
          <button type="button" id="ev-save" class="primary">Save</button>
        </menu>
      </div>
    </dialog>

    <dialog id="conflict-dialog">
      <div class="dlg-body conflicts-dlg">
        <h2>Conflicts</h2>
        <div class="conflicts-layout">
          <div id="conflict-list"></div>
          <div id="conflict-detail"></div>
        </div>
        <menu>
          <span class="spacer"></span>
          <button type="button" id="conflict-close">Close</button>
        </menu>
      </div>
    </dialog>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
