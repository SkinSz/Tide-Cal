name: windows-release

# DC-24 §5.4 (P1, owner-approved 2026-10-11): GitHub Actions windows-latest
# builds the NSIS installer per release tag. Produces:
#   - Tide NSIS installer artifact
#   - SHA256 checksum file next to it (DC-24 §3.2 binding compensating
#     control — a release is INCOMPLETE without the checksum published on
#     the same release page)
# Manual workflow_dispatch for test builds; automatic on tag push v*.
# The OWNER reviews the run and publishes the release — CI never publishes
# by itself (owner standing rule: no auto-publish).

on:
  workflow_dispatch:
  push:
    branches:
      - windows
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-nsis:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned Node for the sidecar ABI (DC-24 §4.4): the better-sqlite3
      # win32 prebuild in the repo is NODE_MODULE_VERSION 147 = Node 26
      # (verified via node-abi registry, blind review 2026-10-12). Node 24
      # is ABI 137 and would REFUSE to load the vendored .node. Keep this
      # version in lockstep with
      # src-tauri/resources/better-sqlite3/PREBUILDS.md.
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "npm"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workdirs: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Build sidecar bundle
        run: npm run sidecar:build

      # Stale-resources-bundle trap (handoff 2026-09-23 §7): after every
      # sidecar:build, the bundle copy in src-tauri/resources must be
      # refreshed and md5-verified against dist/.
      - name: Refresh + verify sidecar resource bundle
        shell: pwsh
        run: |
          Copy-Item dist/sidecar.mjs src-tauri/resources/sidecar.mjs -Force
          $a = (Get-FileHash dist/sidecar.mjs -Algorithm MD5).Hash
          $b = (Get-FileHash src-tauri/resources/sidecar.mjs -Algorithm MD5).Hash
          if ($a -ne $b) { throw "sidecar.mjs resource copy mismatch: $a vs $b" }
          Write-Output "sidecar.mjs md5 verified: $a"

      - name: Build NSIS installer (tauri)
        run: npx tauri build --bundles nsis
        env:
          # Release build; no signing (DC-24 §3.2 — unsigned by design).
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Locate artifacts
        id: artifacts
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $exe) { throw "no NSIS installer produced" }
          $sum = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          $sumFile = $exe.FullName + ".sha256"
          # DC-24 §3.2: "<file> sha256: <digest>" plain-text format
          "$([System.IO.Path]::GetFileName($exe.Name)) sha256: $sum" | Out-File -FilePath $sumFile -Encoding ascii
          Write-Output "exe=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          Write-Output "sumfile=$sumFile" >> $env:GITHUB_OUTPUT
          Write-Output "digest=$sum" >> $env:GITHUB_OUTPUT
          Write-Output "name=$($exe.Name)" >> $env:GITHUB_OUTPUT
          Write-Output "SHA256: $sum"

      - name: Upload artifact (run attachment)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifacts.outputs.name }}
          path: |
            ${{ steps.artifacts.outputs.exe }}
            ${{ steps.artifacts.outputs.sumfile }}
          if-no-files-found: error

      # Tag builds attach BOTH files to a DRAFT release (DC-24 §3.2: the
      # release page must carry installer + checksum together). Owner
      # publishes after review — the draft is never auto-published.
      - name: Attach to draft release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create "$tag" --draft --title "$tag" --notes "Windows NSIS build. Verify the SHA256 checksum before running: see README Windows section (DC-24 §3.2.1)." "${{ steps.artifacts.outputs.exe }}" "${{ steps.artifacts.outputs.sumfile }}" --clobber 2>$null; if ($LASTEXITCODE -ne 0) { gh release upload "$tag" "${{ steps.artifacts.outputs.exe }}" "${{ steps.artifacts.outputs.sumfile }}" --clobber }
        env:
          GH_TOKEN: ${{ github.token }}
